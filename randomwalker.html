<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
</head>
<body>
	<script>
		let xpos 
		let ypos 

		function setup()
		 {
			createCanvas(800,800)
			background(200)
			 xpos = width/2
			 ypos = height/2

			 //let randomNumber = random()
			 //console.log(randomNumber)
		}
		function draw(){
			//move right, left, top, bottom
			let randomNumber = floor(random(4))
			// if randomNumber is equal to 0, move right
			if (randomNumber ==0) {
				xpos = xpos +2
			} else if (randomNumber ==1){
				xpos = xpos -2
			} else if (randomNumber ==2){
				ypos = ypos +2
			} else if (randomNumber ==3) {
				ypos = ypos -2
			}
			circle(xpos, ypos, 50)
		}

	</script>

</body>
</html>
