<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		body{
			background-color: blanchedalmond;
		}
		.confetti{
			width: 10px;
			height: 50px;
			background-color: dodgerblue;
			display: inline-block;
			border: 5px ;
			position: absolute;
			transform: rotate(90deg);
		}

</style>
</head>
<body>

<script type="text/javascript">
let colors = ["red", "green", "blue"]
function makeConfetti (){
	let square = document.createElement("div")
	square.classList.add("confetti")
	document.body.appendChild(square)
	let r=Math.round(Math.random()*255)
	let g=Math.round(Math.random()*255)
	let b=Math.round(Math.random()*255)
square.style.backgroundColor = "rgb("+r+", "+g+", "+b+")"
let x = Math.round(Math.random()*2)

let rotation = Math.random() * 360

square.style.top = Math.random() * 1000 + "px"
square.style.left = Math.random() * window.innerWidth + "px"
square.style.transform = "rotate(" + rotation + "deg)"
square.style.height = Math.random() * 75 + "px"
square.style.width = Math.random () *75 + "px"

function fall(){
	let fallFactor = 10
	square.style.top = parseInt (square.style.top) + fallFactor +"px"
}
	setInterval (fall, 100)

}

setInterval(makeConfetti, 50)
</script>

</body>
</html>
