<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
	<script>
		function setup(){
			createCanvas(400,400)
			
		}
		function draw(){
			background("#327ba8");
			stroke(0)
			fill("#325ab7")
			ellipse(150,150,150,80);
			stroke("#160740")
			fill("#254fc9")
			circle(100,120,80)
			stroke("#400707")
			fill("#657gc7")
			line(400,90,100,100)
			line(200,90,50,50)


		}
	</script>

</body>
