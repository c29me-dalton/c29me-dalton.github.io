<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js">
		
	</script>
</head>
<body>

	<script>
		function setup() {
			createCanvas(800,800)
		}

		function draw() {
			background(200)
			push()
			translate(100, 100)
			//rotate(PI/8)
			rotate(frameCount * 0.05)
			rectMode(CENTER)
			rect(0, 0, 100, 50)
			pop()

			push()
			translate(500, 500)
			rotate(frameCount * 0.05)
			rectMode(CENTER)
			rect(0, 0, 150, 50)
			pop()

			push()
			translate(300, 300)
			rotate(frameCount * 1)
			circle(0-50, 0-50, 50)//right ear
			circle(0+50, 0-50, 50)// left ear
			circle(0, 0, 100)
			pop()
		}
	</script>
</body>
</html>
